name: Release gate

# Runs the edge-case suite on every pull request.
# Demo mode works out of the box. To test a real model, add the secrets below
# and switch to the "Real model" step.

on:
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Edge-case suite (demo responses)
        run: node evals/run.mjs --mock baseline

